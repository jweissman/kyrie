# Kyrie's checks, on every push and pull request: lint and types, and the whole suite in five balanced shards, with
# every skipped spec listed in the run's summary; the long descents; and the browser specs, each against the page it
# builds. A failing spec turns its job red. Deem and the languages package are pinned in package.json (github:owner/name#commit) and installed by
# bun from the lockfile, so a clean clone needs no sibling checkouts. Orsino, whose registry one spec regenerates byte
# for byte, is checked out beside Kyrie at the revision the registry names. See doc/architecture/verification.md.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
defaults:
  run: { working-directory: kyrie }
jobs:
  check:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { path: kyrie }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
  # The suite in five shards, balanced by the time each spec file took when the timings were last kept
  # (test/timings.json): in three, a shard had come to 27 of its 30 minutes, and past them once the Book of Faces'
  # hour of journeys came in (3 November).
  suite:
    name: suite ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    # Forty-five while the Book of Faces' specs are balanced by estimates, not kept timings (a shard ran past thirty).
    timeout-minutes: 45
    strategy: { fail-fast: false, matrix: { shard: [1, 2, 3, 4, 5] } }
    steps:
      - uses: actions/checkout@v4
        with: { path: kyrie }
      - id: orsino
        run: echo "revision=$(jq -r .source.revision data/sources/orsino/registry.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: jweissman/orsino, ref: "${{ steps.orsino.outputs.revision }}", path: orsino }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile
      - run: bun test --parallel --shard=${{ matrix.shard }}/5 --timings=test/timings.json --reporter=junit --reporter-outfile=junit.xml
      - if: always()
        run: bun scripts/test-summary.ts junit.xml --title "Suite, shard ${{ matrix.shard }} of 5"
  long:
    name: long descents
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: kyrie }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile
      - run: bun test test/descent.test.ts --reporter=junit --reporter-outfile=junit.xml
        env: { KYRIE_LONG: "1" }
      - if: always()
        run: bun scripts/test-summary.ts junit.xml --title "Long descents" --none-skipped
  # Two shards since the place's new grammar (6 November): the whole had passed in thirty minutes and then outgrew them.
  browser:
    name: browser specs ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: { fail-fast: false, matrix: { shard: [1, 2] } }
    steps:
      - uses: actions/checkout@v4
        with: { path: kyrie }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - run: bun install --frozen-lockfile
      - run: bunx playwright-core install --with-deps chromium
      # The page the specs play, built once for the shard (see test/support/test-site.ts), not once by each spec.
      - run: bun scripts/build-test-site.ts "${{ runner.temp }}/site"
      - run: bun test --shard=${{ matrix.shard }}/2 $(ls test/*-browser.test.ts) --reporter=junit --reporter-outfile=junit.xml
        env: { KYRIE_BROWSER: "1", KYRIE_SITE: "${{ runner.temp }}/site" }
      - if: always()
        run: bun scripts/test-summary.ts junit.xml --title "Browser specs, shard ${{ matrix.shard }} of 2" --none-skipped
